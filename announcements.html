<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Announcements | FLD Primary</title><script src="auth.js"></script><script src="confirm.js" defer></script>
<link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="announcements.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><link rel="stylesheet" href="page-theme.css"></head>
<body><div class="sayfa"><div id="sidebar-container"></div><main class="main-content"><div id="topbar-container"></div>
<section class="fld-announcements" aria-labelledby="notice-page-title"><header class="notice-header"><div><span class="notice-eyebrow">SCHOOL UPDATES</span><h1 id="notice-page-title">Announcements</h1><p>School updates and important information, in one place.</p></div><button id="notice-add" class="notice-primary" data-admin-only hidden><i class="fa-solid fa-plus" aria-hidden="true"></i> New announcement</button></header>
<div class="notice-toolbar"><label class="notice-search">Search<input id="notice-search" type="search" placeholder="Search announcements..."></label><label>Category<select id="notice-filter"><option value="">All categories</option><option>General</option><option>Meeting</option><option>Deadline</option><option>Update</option></select></label><label>Grade<select id="notice-grade"><option value="">All available grades</option><option value="Shared">Shared</option></select></label></div>
<p id="notice-status" role="status">Loading announcements…</p><div id="notice-list"></div></section></main></div>
<dialog id="notice-dialog" aria-labelledby="notice-heading"><header class="notice-header"><h2 id="notice-heading">Announcement</h2><button id="notice-close" class="notice-secondary" aria-label="Close announcement">×</button></header><div id="notice-detail"></div>
<form id="notice-form" hidden><label>Title<input id="notice-title" maxlength="200" required></label><label>Message<textarea id="notice-message" rows="6" maxlength="8000" required></textarea></label>
<div class="notice-toolbar"><label>Category<select id="notice-type"><option>General</option><option>Meeting</option><option>Deadline</option><option>Update</option></select></label><label>Date<input id="notice-date" type="date" required></label></div>
<fieldset><legend>Audience</legend><label class="notice-check"><input type="checkbox" id="notice-shared" checked>All staff</label><div id="notice-grades"></div></fieldset>
<p id="notice-error" role="alert"></p><footer class="notice-actions"><button id="notice-cancel" type="button" class="notice-secondary">Cancel</button><button id="notice-save" class="notice-primary" type="submit">Publish announcement</button></footer></form></dialog>
<script src="sidebar.js"></script><script src="script.js"></script><script src="announcements.js"></script></body></html>
